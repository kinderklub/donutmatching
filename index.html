<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donut Shop - Kindy Klub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif !important;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #2c1810 url('https://i.postimg.cc/Z5TD1rgF/IMG-5936.jpg') no-repeat center center / cover;
            position: relative;
            transition: background 0.3s ease;
        }

        @media (orientation: landscape) {
            body { background-image: url('https://i.postimg.cc/vTYQ11T8/IMG-5932.png'); }
        }

        /* --- BUTANG KAWALAN (HOME & LANG) --- */
        .top-controls {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 600;
            pointer-events: none; /* Supaya area kosong tak sekat klik */
        }
        
        .top-controls > * { pointer-events: auto; }

        .action-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #d85c70;
            font-weight: 900;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 25px;
            border: 2px solid #ffccd5;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:active { transform: scale(0.95); }

        /* --- FRONT PAGE EKSTRA COMEL --- */
        .front-page {
            position: absolute; inset: 0;
            z-index: 500;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; transition: opacity 0.5s ease;
        }

        .menu-card {
            background: linear-gradient(145deg, #ffffff 0%, #fff0f3 100%);
            width: 100%; max-width: 380px;
            border-radius: 40px; padding: 40px 20px;
            text-align: center; position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            border: 8px solid #ffb6c1;
            animation: floatCard 4s infinite alternate ease-in-out;
        }

        @keyframes floatCard { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }

        /* Hiasan Terapung Keliling Menu */
        .menu-card::before { content: '✨'; position: absolute; top: -15px; left: -10px; font-size: 35px; animation: floatIcon 2s infinite alternate; }
        .menu-card::after { content: '💖'; position: absolute; bottom: -15px; right: -10px; font-size: 35px; animation: floatIcon 2.5s infinite alternate-reverse; }
        @keyframes floatIcon { 0% { transform: scale(0.9) translateY(0); opacity: 0.8; } 100% { transform: scale(1.1) translateY(-10px); opacity: 1; } }

        .menu-logo { width: 90px; margin-bottom: 5px; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.2)); animation: pop 0.5s ease-out; }
        
        .side-donut-1 { position: absolute; width: 50px; left: -25px; top: 40%; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.3)); animation: floatDonut 3s infinite alternate; }
        .side-donut-2 { position: absolute; width: 45px; right: -20px; top: 20%; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.3)); animation: floatDonut 2.5s infinite alternate-reverse; }

        .title-main { 
            color: #ff5277; 
            font-size: 32px; font-weight: 900; margin-bottom: 5px; 
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffccd5;
        }
        .subtitle { color: #888; font-size: 14px; font-weight: 700; margin-bottom: 25px; }
        
        .tier-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .tier-btn {
            flex: 1; padding: 12px 8px; border-radius: 20px;
            border: 3px solid #f1f5f9; background: #ffffff;
            font-weight: 900; font-size: 14px; color: #a0aec0; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .tier-btn.active { background: #ffe6ea; border-color: #ff5277; color: #ff5277; transform: scale(1.05); box-shadow: 0 6px 12px rgba(255, 82, 119, 0.2); }
        
        .btn-primary {
            width: 100%; background: linear-gradient(180deg, #ff6b81 0%, #d85c70 100%);
            color: #ffffff; font-size: 20px; font-weight: 900; padding: 16px;
            border: none; border-radius: 25px;
            box-shadow: 0 8px 0 #a83b4c, 0 15px 25px rgba(216,92,112,0.4); cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: translateY(6px); box-shadow: 0 2px 0 #a83b4c; }

        /* --- GAME UI CONTAINER --- */
        .game-ui {
            display: flex; flex-direction: column; justify-content: space-between;
            height: 100%; width: 100%; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
            padding-bottom: 35px; /* Tolak footer */
            padding-top: 60px; /* Tolak controls */
        }
        .game-ui.active { opacity: 1; pointer-events: auto; }

        /* Resit Order */
        .receipt-container {
            margin: 0 auto; background: #fffde7; padding: 10px 16px; border-radius: 4px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2); border-top: 8px dashed #dcd8c0;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }
        .receipt-title { color: #8b8565; font-size: 14px; font-weight: 900; letter-spacing: 1.5px; margin-bottom: 6px; }
        .receipt-items { display: flex; gap: 8px; }
        .receipt-icon { width: 38px; height: 38px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15)); transition: all 0.4s; }
        .receipt-icon.fulfilled { filter: grayscale(100%) opacity(0.2); transform: scale(0.7); }

        /* --- KOTAK 3D --- */
        .game-viewport { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 0 10px; }
        .box-wrapper { position: relative; width: 100%; max-width: 420px; perspective: 800px; margin-bottom: 15px; }
        .packing-box {
            background: #fff0f3; border: 4px solid #f4c2c2; border-radius: 8px;
            box-shadow: inset 0 15px 30px rgba(0,0,0,0.1), 0 20px 40px rgba(0,0,0,0.25);
            padding: 12px 10px; display: grid; gap: 10px; width: 100%; z-index: 5; position: relative; transition: transform 0.2s ease;
        }
        .box-wrapper::before { content: ''; position: absolute; top: -28px; left: 0; right: 0; height: 28px; background: #ffd6df; border: 2px solid #f4c2c2; border-bottom: none; border-radius: 6px 6px 0 0; transform-origin: bottom; transform: rotateX(45deg); z-index: 1; }
        .box-wrapper::after { content: ''; position: absolute; bottom: -28px; left: 0; right: 0; height: 28px; background: #ffd6df; border: 2px solid #f4c2c2; border-top: none; border-radius: 0 0 6px 6px; transform-origin: top; transform: rotateX(-45deg); z-index: 10; box-shadow: 0 15px 20px rgba(0,0,0,0.2); }
        .grid-t1 { grid-template-columns: repeat(3, 1fr); }
        .grid-t2 { grid-template-columns: repeat(3, 1fr); }
        .box-slot { aspect-ratio: 1; border-radius: 50%; background: rgba(0, 0, 0, 0.04); border: 2px dashed rgba(244, 194, 194, 0.9); display: flex; justify-content: center; align-items: center; box-shadow: inset 0 4px 8px rgba(0,0,0,0.06); width: 100%; min-width: 0; }

        /* Dulang Bawah */
        .inventory-panel {
            width: 95%; max-width: 460px; margin: 0 auto 10px auto;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-radius: 30px;
            padding: 12px 8px; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.15); border: 3px solid #fff; min-height: 110px; position: relative; z-index: 15;
        }
        .draggable-donut { width: 68px; height: 68px; object-fit: contain; cursor: grab; position: relative; z-index: 50; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.22)); animation: floatDonut 3s infinite alternate ease-in-out; touch-action: none; }
        @keyframes floatDonut { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
        .draggable-donut.dragging { animation: none; z-index: 1000; filter: drop-shadow(0 25px 20px rgba(0,0,0,0.45)); transform: scale(1.3) !important; }
        .placed-donut { width: 100%; height: 100%; object-fit: contain; animation: popInSlot 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 5px 8px rgba(0,0,0,0.2)); pointer-events: none; }
        @keyframes popInSlot { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

        /* Footer */
        .app-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); text-align: center; padding: 8px; font-size: 10px; font-weight: 700;
            color: #d85c70; border-top: 1px solid rgba(216, 92, 112, 0.2); z-index: 999; letter-spacing: 0.5px;
        }

        .modal-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- BUTANG KAWALAN (HOME & LANG) -->
    <div class="top-controls">
        <button class="action-btn hidden" id="btn-home" onclick="goHome()">🏠</button>
        <div style="flex:1"></div> <!-- Spacer -->
        <button class="action-btn" id="btn-lang" onclick="toggleLang()">🇬🇧 EN</button>
    </div>

    <!-- 1. FRONT PAGE -->
    <div class="front-page" id="front-page">
        <div class="menu-card">
            <img src="https://i.postimg.cc/SKsqpXRw/IMG-5953.png" class="side-donut-1">
            <img src="https://i.postimg.cc/q75rBkCV/IMG-5955.png" class="side-donut-2">
            
            <img src="https://i.postimg.cc/YSs72pmm/IMG-5963.png" class="menu-logo">
            <div class="title-main" id="txt-title">DONUT SHOP</div>
            <div class="subtitle" id="txt-subtitle">Pack orders for Kindy Klub!</div>
            
            <div class="tier-container">
                <button class="tier-btn active" id="btn-t1" onclick="selectTier(1)">
                    <div style="font-size: 16px;" id="txt-t1-lvl">Level 1</div>
                    <div style="font-size:11px; opacity:0.7;" id="txt-t1-sub">3 Donuts</div>
                </button>
                <button class="tier-btn" id="btn-t2" onclick="selectTier(2)">
                    <div style="font-size: 16px;" id="txt-t2-lvl">Level 2</div>
                    <div style="font-size:11px; opacity:0.7;" id="txt-t2-sub">6 Donuts</div>
                </button>
            </div>
            
            <button class="btn-primary" id="btn-start" onclick="startGame()">▶ PLAY NOW</button>
        </div>
    </div>

    <!-- 2. GAME UI -->
    <div class="game-ui" id="game-ui">
        <div class="receipt-container" id="order-receipt">
            <div class="receipt-title" id="txt-order-title">ORDER #01</div>
            <div class="receipt-items" id="receipt-items"></div>
        </div>

        <div class="game-viewport">
            <div class="box-wrapper">
                <div class="packing-box" id="packing-box"></div>
            </div>
        </div>

        <div class="inventory-panel" id="inventory"></div>
    </div>

    <!-- 3. FOOTER -->
    <div class="app-footer" id="txt-footer">
        &copy; 2026 KINDY KLUB • ALL RIGHTS RESERVED
    </div>

    <!-- 4. VICTORY MODAL -->
    <div class="modal-overlay hidden" id="victory-modal">
        <div class="menu-card" style="border: 6px solid #bde0fe; background: linear-gradient(145deg, #ffffff 0%, #e0fbfc 100%);">
            <div class="title-main" style="color: #48cae4; text-shadow: 2px 2px 0px #fff, 3px 3px 0px #bde0fe;" id="txt-vic-title">AWESOME! 🎉</div>
            <div class="subtitle" id="txt-vic-sub">Donut box ready for delivery!</div>
            <button class="btn-primary" style="background: linear-gradient(180deg, #48cae4 0%, #0096c7 100%); box-shadow: 0 8px 0 #0077b6;" id="btn-next" onclick="nextOrder()">NEXT ORDER</button>
        </div>
    </div>

    <script>
        // Data Terjemahan
        const dict = {
            'EN': {
                langBtn: '🇬🇧 EN',
                title: 'DONUT SHOP', sub: 'Pack orders for Kindy Klub!',
                l1: 'Level 1', d3: '3 Donuts',
                l2: 'Level 2', d6: '6 Donuts',
                start: '▶ PLAY NOW',
                order: 'ORDER #',
                vicTitle: 'AWESOME! 🎉', vicSub: 'Donut box ready for delivery!', next: 'NEXT ORDER',
                footer: '&copy; 2026 KINDY KLUB • ALL RIGHTS RESERVED'
            },
            'BM': {
                langBtn: '🇲🇾 BM',
                title: 'KEDAI DONUT', sub: 'Bungkus order pelanggan Kindy Klub!',
                l1: 'Tahap 1', d3: '3 Biji Donut',
                l2: 'Tahap 2', d6: '6 Biji Donut',
                start: '▶ MULA MAIN',
                order: 'PESANAN #',
                vicTitle: 'TERBAIK! 🎉', vicSub: 'Kotak donut sedia dihantar!', next: 'ORDER SETERUSNYA',
                footer: '&copy; 2026 KINDY KLUB • HAK CIPTA TERPELIHARA'
            }
        };

        let curLang = 'EN';

        function toggleLang() {
            curLang = curLang === 'EN' ? 'BM' : 'EN';
            applyLang();
        }

        function applyLang() {
            let t = dict[curLang];
            document.getElementById('btn-lang').innerHTML = t.langBtn;
            document.getElementById('txt-title').innerHTML = t.title;
            document.getElementById('txt-subtitle').innerHTML = t.sub;
            document.getElementById('txt-t1-lvl').innerHTML = t.l1;
            document.getElementById('txt-t1-sub').innerHTML = t.d3;
            document.getElementById('txt-t2-lvl').innerHTML = t.l2;
            document.getElementById('txt-t2-sub').innerHTML = t.d6;
            document.getElementById('btn-start').innerHTML = t.start;
            document.getElementById('txt-vic-title').innerHTML = t.vicTitle;
            document.getElementById('txt-vic-sub').innerHTML = t.vicSub;
            document.getElementById('btn-next').innerHTML = t.next;
            document.getElementById('txt-footer').innerHTML = t.footer;
            
            let currentOrderNum = String(orderNumber).padStart(2, '0');
            document.getElementById('txt-order-title').textContent = t.order + currentOrderNum;
        }

        const donutDB = [
            { id: 'dn1', url: 'https://i.postimg.cc/SKsqpXRw/IMG-5953.png' },
            { id: 'dn2', url: 'https://i.postimg.cc/g0TpcYLf/IMG-5954.png' },
            { id: 'dn3', url: 'https://i.postimg.cc/q75rBkCV/IMG-5955.png' },
            { id: 'dn4', url: 'https://i.postimg.cc/SKv4Qyzy/IMG-5956.png' },
            { id: 'dn5', url: 'https://i.postimg.cc/mr54ZbFW/IMG-5958.png' },
            { id: 'dn6', url: 'https://i.postimg.cc/TP4x2RWd/IMG-5959.png' },
            { id: 'dn7', url: 'https://i.postimg.cc/vmNy8Q6Z/IMG-5960.png' },
            { id: 'dn8', url: 'https://i.postimg.cc/hG5n4S74/IMG-5961.png' },
            { id: 'dn9', url: 'https://i.postimg.cc/TP4x2RWw/IMG-5962.png' },
            { id: 'dn10', url: 'https://i.postimg.cc/YSs72pmm/IMG-5963.png' }
        ];

        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain); gain.connect(AudioCtx.destination);
            if (type === 'grab') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, AudioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, AudioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, AudioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, AudioCtx.currentTime + 0.1); osc.start(); osc.stop(AudioCtx.currentTime + 0.1);
            } else if (type === 'snap') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, AudioCtx.currentTime); osc.frequency.setValueAtTime(1000, AudioCtx.currentTime + 0.05); gain.gain.setValueAtTime(0.35, AudioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, AudioCtx.currentTime + 0.15); osc.start(); osc.stop(AudioCtx.currentTime + 0.15);
            } else if (type === 'boing') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, AudioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, AudioCtx.currentTime + 0.25); gain.gain.setValueAtTime(0.2, AudioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, AudioCtx.currentTime + 0.25); osc.start(); osc.stop(AudioCtx.currentTime + 0.25);
            }
        }

        let selectedTier = 1;
        let matchedCount = 0;
        let totalItems = 3;
        let orderNumber = 1;
        let activeDonut = null;
        let startX, startY, currentX = 0, currentY = 0;

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function selectTier(tier) {
            selectedTier = tier;
            document.getElementById('btn-t1').classList.toggle('active', tier === 1);
            document.getElementById('btn-t2').classList.toggle('active', tier === 2);
        }

        function startGame() {
            document.getElementById('front-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('front-page').classList.add('hidden');
                document.getElementById('btn-home').classList.remove('hidden'); // Tunjuk Butang Home
                document.getElementById('game-ui').classList.add('active');
            }, 400);
            totalItems = selectedTier === 1 ? 3 : 6;
            orderNumber = 1; // Reset resit
            applyLang();
            buildLevel();
        }

        function goHome() {
            document.getElementById('game-ui').classList.remove('active');
            document.getElementById('btn-home').classList.add('hidden'); // Sorok Butang Home
            document.getElementById('victory-modal').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('front-page').classList.remove('hidden');
                setTimeout(() => document.getElementById('front-page').style.opacity = '1', 50);
            }, 400);
        }

        function nextOrder() {
            orderNumber++;
            document.getElementById('victory-modal').classList.add('hidden');
            applyLang();
            buildLevel();
        }

        function buildLevel() {
            matchedCount = 0;
            const packingBox = document.getElementById('packing-box');
            const inventory = document.getElementById('inventory');
            const receipt = document.getElementById('receipt-items');
            
            packingBox.innerHTML = ''; inventory.innerHTML = ''; receipt.innerHTML = '';
            packingBox.className = `packing-box grid-t${selectedTier}`;

            let shuffledDB = shuffle([...donutDB]);
            let orderDonuts = shuffledDB.slice(0, totalItems);
            let extraCount = selectedTier === 1 ? 3 : 4; 
            let decoyDonuts = shuffledDB.slice(totalItems, totalItems + extraCount);
            
            orderDonuts.forEach(d => {
                let img = document.createElement('img');
                img.src = d.url; img.className = 'receipt-icon'; img.id = 'req-' + d.id;
                receipt.appendChild(img);
            });

            for(let i=0; i<totalItems; i++) {
                let slot = document.createElement('div');
                slot.className = 'box-slot';
                packingBox.appendChild(slot);
            }

            let inventoryDonuts = shuffle([...orderDonuts, ...decoyDonuts]);
            inventoryDonuts.forEach(d => {
                let img = document.createElement('img');
                img.src = d.url; img.className = 'draggable-donut'; img.dataset.id = d.id; img.draggable = false;
                img.addEventListener('pointerdown', dragStart);
                inventory.appendChild(img);
            });
            
            document.getElementById('order-receipt').style.animation = 'none';
            setTimeout(() => document.getElementById('order-receipt').style.animation = '', 10);
        }

        function dragStart(e) {
            e.preventDefault();
            if (activeDonut) return;
            playSound('grab');
            activeDonut = e.target;
            activeDonut.style.animation = 'none';
            activeDonut.classList.add('dragging');
            startX = e.clientX; startY = e.clientY; currentX = 0; currentY = 0;
            document.addEventListener('pointermove', dragMove);
            document.addEventListener('pointerup', dragEnd);
        }

        function dragMove(e) {
            if (!activeDonut) return;
            e.preventDefault();
            currentX = e.clientX - startX; currentY = e.clientY - startY;
            activeDonut.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.3)`;
            activeDonut.style.pointerEvents = 'none';
            let elementBelow = document.elementFromPoint(e.clientX, e.clientY);
            activeDonut.style.pointerEvents = 'auto';
            document.getElementById('packing-box').classList.remove('hovered');
            if (elementBelow && elementBelow.closest('.packing-box')) {
                document.getElementById('packing-box').classList.add('hovered');
            }
        }

        function dragEnd(e) {
            if (!activeDonut) return;
            document.removeEventListener('pointermove', dragMove); document.removeEventListener('pointerup', dragEnd);
            activeDonut.classList.remove('dragging');
            let packingBox = document.getElementById('packing-box'); packingBox.classList.remove('hovered');
            activeDonut.style.pointerEvents = 'none';
            let elementBelow = document.elementFromPoint(e.clientX, e.clientY);
            activeDonut.style.pointerEvents = 'auto';
            let dropZone = elementBelow ? elementBelow.closest('.packing-box') : null;

            if (dropZone) {
                let id = activeDonut.dataset.id;
                let receiptIcon = document.getElementById('req-' + id);
                if (receiptIcon && !receiptIcon.classList.contains('fulfilled')) {
                    playSound('snap'); receiptIcon.classList.add('fulfilled');
                    let emptySlot = dropZone.querySelector('.box-slot:empty');
                    if(emptySlot) {
                        let placedImg = document.createElement('img');
                        placedImg.src = activeDonut.src; placedImg.className = 'placed-donut'; emptySlot.appendChild(placedImg);
                    }
                    activeDonut.remove(); matchedCount++;
                    if (matchedCount === totalItems) {
                        setTimeout(() => document.getElementById('victory-modal').classList.remove('hidden'), 600);
                    }
                } else {
                    playSound('boing'); activeDonut.style.transform = `translate(0px, 0px) scale(1)`; activeDonut.style.animation = 'floatDonut 3s infinite alternate ease-in-out';
                }
            } else {
                playSound('boing'); activeDonut.style.transform = `translate(0px, 0px) scale(1)`; activeDonut.style.animation = 'floatDonut 3s infinite alternate ease-in-out';
            }
            activeDonut = null;
        }

        // Initialize set language on load
        applyLang();
    </script>
</body>
</html>
